<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF6B35" />
    <meta name="description" content="Discover, rate, and explore the best food stalls inside Mercato Lucena. Check live crowd density metrics, and claim exclusive discount vouchers." />
    <title>MercatoView - Mercato Lucena Digital Review & Discovery Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully: ', reg.scope))
            .catch(err => console.log('Service Worker registration failed: ', err));
        });
      }
    </script>
  </body>
</html>
